<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="60" />
    <title>Spam Detector Inbox</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f8f9fa;
        margin: 40px;
        color: #333;
      }

      h1 {
        color: #343a40;
        text-align: center;
        margin-bottom: 30px;
      }

      table {
        width: 80%;
        margin: 0 auto;
        border-collapse: collapse;
        background-color: white;
        box-shadow: 0 8px 8px rgba(0, 0, 0, 0.5);
      }

      th,
      td {
        padding: 15px;
        text-align: left;
        border-bottom: 1px solid #dee2e6;
      }

      th {
        background-color: #007bff;
        color: white;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      tr:hover {
        background-color: #f1f1f1;
      }

      .spam {
        color: #dc3545;
        font-weight: bold;
      }

      .ham {
        color: #28a745;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>Your Inbox - Spam Detector</h1>
    <table>
      <tr>
        <th>Subject</th>
        <th>Label</th>
      </tr>
      {% for email in emails %}
      <tr>
        <td>{{ email.subject }}</td>
        <td class="{{ email.label }}">{{ email.label }}</td>
      </tr>
      {% endfor %}
    </table>

    <script>
      setTimeout(function () {
        window.location.reload(1);
      }, 60000);
    </script>
  </body>
</html>
